name: Dependency audit

on:
  pull_request:
  push:
    branches: [false]
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production npm dependencies in .
        working-directory: "."
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit Python dependencies in 
        run: python -m pip_audit -r ""
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Audit Composer dependencies in .
        working-directory: "."
        run: composer audit --locked --no-dev --abandoned=ignore
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Audit Go dependencies in .
        working-directory: "."
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
